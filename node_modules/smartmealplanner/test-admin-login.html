<!DOCTYPE html>
<html>
<head>
    <title>Test Admin Login</title>
</head>
<body>
    <h1>Admin Login Test</h1>
    <button onclick="loginAdmin()">Login as Admin</button>
    <button onclick="testAPI()">Test Admin API</button>
    <button onclick="clearStorage()">Clear Storage</button>
    <div id="result"></div>

    <script>
        async function loginAdmin() {
            try {
                const response = await fetch('http://localhost:5001/api/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin',
                        password: 'admin1234'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    document.getElementById('result').innerHTML = `<p style="color: green;">Login successful! Token stored.</p>`;
                    console.log('Token:', data.token);
                } else {
                    document.getElementById('result').innerHTML = `<p style="color: red;">Login failed: ${data.message}</p>`;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        async function testAPI() {
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    document.getElementById('result').innerHTML = `<p style="color: red;">No token found. Please login first.</p>`;
                    return;
                }
                
                const response = await fetch('http://localhost:5001/api/meals/admin/all', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('result').innerHTML = `<p style="color: green;">API test successful! Found ${data.data.length} recipes.</p>`;
                    console.log('Recipes:', data.data);
                } else {
                    document.getElementById('result').innerHTML = `<p style="color: red;">API test failed: ${data.message}</p>`;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        function clearStorage() {
            localStorage.clear();
            document.getElementById('result').innerHTML = `<p style="color: blue;">Storage cleared.</p>`;
        }
    </script>
</body>
</html>
